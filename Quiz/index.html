<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ MSIL Speed Quiz & Leaderboard ⚡</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h2 { color: #1e3c72; margin-top: 0; }
        h3 { color: #2d3748; font-size: 20px; line-height: 1.5; margin-bottom: 25px; }
        .lang-hi { color: #4a5568; font-weight: 600; display: block; margin-bottom: 8px; }
        .lang-en { color: #718096; font-style: italic; display: block; font-size: 16px; }
        .timer {
            font-size: 32px;
            font-weight: bold;
            color: #e53e3e;
            background: #fff5f5;
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #fed7d7;
            display: inline-block;
            margin-bottom: 25px;
            font-family: monospace;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            margin: 12px 0;
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .btn:hover {
            background-color: #edf2f7;
            border-color: #cbd5e0;
            transform: translateY(-2px);
        }
        .btn-start {
            background: #48bb78 !important;
            color: white !important;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border: none;
        }
        .btn-start:hover { background: #38a169 !important; }
        .hidden { display: none; }
        
        /* Leaderboard Styling */
        .leaderboard-box {
            margin-top: 25px;
            text-align: left;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
        }
        .leaderboard-title {
            font-weight: bold;
            font-size: 18px;
            color: #2b6cb0;
            margin-bottom: 10px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 5px;
            text-align: center;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 10px;
            text-align: left;
        }
        .leaderboard-table th { background-color: #e2e8f0; color: #4a5568; }
        .leaderboard-table tr:nth-child(even) { background-color: #edf2f7; }
        .rank-1 { background-color: #fef3c7 !important; font-weight: bold; } /* Winner Highlight */
    </style>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, set, onValue } from "https://gstatic.com";

        // ⚠️ PASTE YOUR UNIQUE FIREBASE CONFIG OBJECT HERE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_://firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_://firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_://appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Expose functions globally so regular HTML button actions work seamlessly
        window.saveScoreToCloud = function(name, empId, timeInMs, formattedTime, isPerfect) {
            const scoresRef = ref(database, 'quiz_scores');
            const newScoreRef = push(scoresRef);
            set(newScoreRef, {
                name: name,
                empId: empId,
                timeMs: timeInMs,
                timeStr: formattedTime,
                perfect: isPerfect,
                timestamp: Date.now()
            }).then(() => {
                loadLeaderboard();
            });
        }

        window.loadLeaderboard = function() {
            const scoresRef = ref(database, 'quiz_scores');
            onValue(scoresRef, (snapshot) => {
                const data = snapshot.val();
                let records = [];
                for (let id in data) {
                    records.push(data[id]);
                }

                // Sort Strategy: 
                // 1. Perfect scores always outrank imperfect scores
                // 2. If both are perfect, lowest time (fastest) wins
                records.sort((a, b) => {
                    if (a.perfect !== b.perfect) {
                        return a.perfect ? -1 : 1; 
                    }
                    return a.timeMs - b.timeMs;
                });

                let html = `
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Name (ID)</th>
                                <th>Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                records.forEach((player, index) => {
                    const rowClass = (index === 0 && player.perfect) ? 'rank-1' : '';
                    const statusText = player.perfect ? "✅ 5/5" : "❌ Disqualified";
                    const rankText = (index === 0 && player.perfect) ? "🏆 1st" : `${index + 1}`;
                    
                    html += `
                        <tr class="${rowClass}">
                            <td>${rankText}</td>
                            <td>${player.name} (${player.empId})</td>
                            <td>${player.timeStr}</td>
                            <td>${statusText}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                document.getElementById('leaderboard-container').innerHTML = html;
            });
        }
    </script>
</head>
<body>

<div class="quiz-container">
    <!-- Start Screen -->
    <div id="start-screen">
        <h2>⚡ MSIL Speed Quiz Challenge ⚡</h2>
        <p style="font-size: 14px; color: #4a5568;">विवरण दर्ज करें और क्विज़ शुरू करें / Enter details to begin:</p>
        
        <input type="text" id="player-name" class="input-field" placeholder="आपका नाम / Full Name" required>
        <input type="text" id="player-id" class="input-field" placeholder="टोकन नंबर / Employee ID" required>
        
        <button class="btn btn-start" onclick="validateAndStart()">START CLOCK & QUIZ</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
        <div class="timer" id="timer">00:00.000</div>
        <h3 id="question-text">
            <span class="lang-hi" id="q-hi">प्रश्न</span>
            <span class="lang-en" id="q-en">Question</span>
        </h3>
        <div id="options-container"></div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="hidden">
        <div id="result-message"></div>
        
        <!-- Live Global Ranks -->
        <div class="leaderboard-box">
            <div class="leaderboard-title">📊 Live Leaderboard (Winner on Top)</div>
            <div id="leaderboard-container">Loading scores...</div>
        </div>
        
        <button class="btn btn-start" style="background: #4299e1 !important; text-align: center; margin-top:20px;" onclick="location.reload()">Try Again / दोबारा प्रयास करें</button>
    </div>
</div>

<script>
    const quizData = [
        {
            qHi: "1. GCA का पूरा नाम क्या हैं ?", qEn: "What is full form of GCA ?",
            optsHi: ["ग्लोबल कस्टमर ऑडिट", "गुड्स कस्टमर ऑडिट", "ग्लोबल सेण्टर ऑडिट", "ग्लोबल कण्ट्रोल ऑडिट"],
            optsEn: ["Global Customer Audit", "Goods Customer Audit", "Global Center Audit", "Global Control Audit"],
            correct: 0
        },
        {
            qHi: "2. MOS का पूरा नाम क्या हैं ?", qEn: "What is full form of MOS ?",
            optsHi: ["मारुती ऑपरेशन सिस्टम", "मल्टी ऑपरेशन सिस्टम", "मारुती ऑपरेशन स्टैंडर्ड्", "मारुती ओवरआल स्टैण्डर्ड"],
            optsEn: ["Maruti Operation System", "Multi Operation System", "Maruti Operation Standard", "Maruti Overall Standard"],
            correct: 2
        },
        {
            qHi: "3. ISO -9001-2015 का क्या उद्देश्य हें", qEn: "What is ISO-9001-2015 for?",
            optsHi: ["सुरक्षा", "पर्यावरण", "गुणवत्ता", "कीमत"],
            optsEn: ["Safety", "Environment", "Quality", "Cost"],
            correct: 2
        },
                {
            qHi: "4. MSIL प्लांट के अंदर ड्राइविंग के लिए क्या ज़रूरी हें", qEn: "What is required to drive vehicle inside MSIL plant?",
            optsHi: ["लाइसेन्स", "' D' बॅड्ज", "पहचान पत्र", "कुछ भी नही"],
            optsEn: ["License", "'D' Badge", "ID Card", "Nothing"],
            correct: 1
        },
        {
            qHi: "5. अगर किसी वजह से गाड़ी चेक नहीं की जा सकी हो तो क्या करें?",
            qEn: "If you have failed to complete the inspection, what should be done ?",
            optsHi: ["वाहन को बिना निरीक्षण के जाने दें", "चेक शीट के special कॉलम में स्टेशन के नाम के साथ 'NO CHECK' लिखें", "स्टाम्प न लगाएं", "Option B और C"],
            optsEn: ["Let the vehicle go without inspection", "Write 'NO CHECK' with station name in special column of check sheet", "Do not apply stamp", "Option B and C"],
            correct: 3
        }
    ];

    let currentQuestionIndex = 0;
    let startTime;
    let timerInterval;
    let perfectScore = true;
    let userName = "";
    let userEmpId = "";
    let finalTimeElapsedMs = 0;

    function validateAndStart() {
        userName = document.getElementById('player-name').value.trim();
        userEmpId = document.getElementById('player-id').value.trim();

        if(!userName || !userEmpId){
            alert("कृपया नाम और टोकन नंबर दोनों भरें! / Please enter both Name and Employee ID!");
            return;
        }
        startQuiz();
    }

    function startQuiz() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        startTime = performance.now();
        timerInterval = setInterval(updateTimer, 10);
        showQuestion();
    }

    function updateTimer() {
        const timeElapsed = performance.now() - startTime;
        finalTimeElapsedMs = timeElapsed;
        
        const minutes = Math.floor(timeElapsed / 60000);
        const seconds = Math.floor((timeElapsed % 60000) / 1000);
        const milliseconds = Math.floor(timeElapsed % 1000);
        
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
    }

    function showQuestion() {
        const currentQuestion = quizData[currentQuestionIndex];
        document.getElementById('q-hi').innerText = currentQuestion.qHi;
        document.getElementById('q-en').innerText = currentQuestion.qEn;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        currentQuestion.optsHi.forEach((optHi, index) => {
            const optEn = currentQuestion.optsEn[index];
            const button = document.createElement('button');
            button.classList.add('btn');
            button.innerHTML = `
                <span style="display:block; font-weight:600; color:#2d3748;">${optHi}</span>
                <span style="display:block; font-size:14px; color:#718096; font-style:italic;">${optEn}</span>
            `;
            button.onclick = () => handleAnswer(index);
            optionsContainer.appendChild(button);
        });
    }

    function handleAnswer(selectedIndex) {
        if (selectedIndex !== quizData[currentQuestionIndex].correct) {
            perfectScore = false;
        }
        
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            showQuestion();
        } else {
            endQuiz();
        }
    }

    function endQuiz() {
        clearInterval(timerInterval);
        const finalTimeStr = document.getElementById('timer').innerText;
        
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        
        const resultMessage = document.getElementById('result-message');
        
        if (perfectScore) {
            resultMessage.innerHTML = `
                <div style="font-size:24px; font-weight:bold; color:#38a169;">🏆 PERFECT SCORE! / पूर्ण अंक! 🏆</div>
                <p>Your Time: <span style="color:#e53e3e; font-weight:bold;">${finalTimeStr}</span></p>
            `;
        } else {
            resultMessage.innerHTML = `
                <div style="font-size:24px; font-weight:bold; color:#e53e3e;">❌ Disqualified / अयोग्य ❌</div>
                <p style="color:#718096; font-size:14px;">One or more wrong answers. Better luck next time!</p>
            `;
        }

        // Send data to Firebase Cloud Server
        window.saveScoreToCloud(userName, userEmpId, finalTimeElapsedMs, finalTimeStr, perfectScore);
           } // This closes the endQuiz function properly at line 374
           function clearLeaderboard() {
    let adminNameInput = prompt("Enter Admin Name / एडमिन का नाम दर्ज करें:");
    if (adminNameInput === null) return; 

    let adminIdInput = prompt("Enter Admin Employee ID / एडमिन टोकन नंबर दर्ज करें:");
    if (adminIdInput === null) return; 

    if (adminNameInput.trim() === "Sateesha" && adminIdInput.trim() === "255769") {
        if(confirm("Are you sure you want to delete all scores and unlock devices?\nक्या आप सचमुच सारा डेटा डिलीट करना चाहते हैं?")) {
            localStorage.removeItem('msil_october_quiz_scores');
            localStorage.removeItem('msil_quiz_submitted');
            alert("Database cleared successfully! / डेटा सफलतापूर्वक डिलीट कर दिया गया है।");
            location.reload();
        }
    } else {
        alert("🛑 Access Denied! Incorrect Admin Credentials.\nडेटा डिलीट करने की अनुमति नहीं है। केवल अधिकृत एडमिन ही इसे हटा सकता है।");
    }
}

// Auto-check table status if page ends on ranking view
window.onload = function() {
    let currentList = JSON.parse(localStorage.getItem('msil_october_quiz_scores')) || [];
    if(Array.isArray(currentList) && document.getElementById('end-leaderboard-container')) {
        handleRenderTable(currentList, 'end-leaderboard-container');
    }
}
</script>
</body>
</html>
