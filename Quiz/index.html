<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ MSIL Speed Quiz & Live Local Dashboard ⚡</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }
        h2 { color: #1e3c72; margin-top: 0; }
        h3 { color: #2d3748; font-size: 20px; line-height: 1.5; margin-bottom: 25px; }
        .lang-hi { color: #4a5568; font-weight: 600; display: block; margin-bottom: 8px; }
        .lang-en { color: #718096; font-style: italic; display: block; font-size: 16px; }
        .timer {
            font-size: 32px;
            font-weight: bold;
            color: #e53e3e;
            background: #fff5f5;
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #fed7d7;
            display: inline-block;
            margin-bottom: 25px;
            font-family: monospace;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            margin: 12px 0;
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .btn:hover { background-color: #edf2f7; border-color: #cbd5e0; transform: translateY(-2px); }
        .btn-start {
            display: block;
            width: 100%;
            padding: 14px 20px;
            margin: 12px 0;
            background: #48bb78 !important;
            color: white !important;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-start:hover { background: #38a169 !important; }
        .hidden { display: none; }
        .master-panel { margin-top: 25px; text-align: left; background: #f7fafc; border: 2px solid #cbd5e0; border-radius: 10px; padding: 20px; }
        .master-title { font-weight: bold; font-size: 20px; color: #2b6cb0; margin-bottom: 15px; border-bottom: 3px solid #cbd5e0; padding-bottom: 5px; text-align: center; }
        .master-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .master-table th, .master-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .master-table th { background-color: #4a5568; color: white; }
        .master-table tr:nth-child(even) { background-color: #edf2f7; }
        .winner-row { background-color: #fef3c7 !important; font-weight: bold; color: #b7791f; }
        .admin-link { display: inline-block; margin-top: 30px; color: #718096; font-size: 12px; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- Start Screen -->
    <div id="start-screen">
        <h2>⚡ MSIL Speed Quiz Challenge ⚡</h2>
        <p style="font-size: 14px; color: #4a5568;">विवरण दर्ज करें और क्विज़ शुरू करें / Enter details to begin:</p>
        
        <input type="text" id="player-name" class="input-field" placeholder="आपका नाम / Full Name" required>
        <input type="text" id="player-id" class="input-field" placeholder="टोकन नंबर / Employee ID" required>
        
        <button class="btn-start" onclick="validateAndStart()">START CLOCK & QUIZ</button>
        <div class="admin-link" onclick="showMasterDashboard()">📊 Open Master Dashboard Window (Admin Only)</div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
        <div class="timer" id="timer">00:00.000</div>
        <h3 id="question-text">
            <span class="lang-hi" id="q-hi">प्रश्न</span>
            <span class="lang-en" id="q-en">Question</span>
        </h3>
        <div id="options-container"></div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="hidden">
        <div id="result-message"></div>
        
        <!-- Local Leaderboard Container inside End Screen -->
        <div class="master-panel">
            <div class="master-title">📊 Live Leaderboard (Winner on Top)</div>
            <div id="end-leaderboard-container">Loading scores...</div>
        </div>

        <button class="btn-start" style="background: #4299e1 !important; margin-top:20px;" onclick="location.reload()">Try Again / दोबारा प्रयास करें</button>
    </div>

    <!-- Master Monitor Panel -->
    <div id="master-dashboard-screen" class="hidden">
        <div class="master-panel">
            <div class="master-title">🏆 MSIL LIVE MASTER DASHBOARD 🏆</div>
            <div id="master-table-container">Loading table...</div>
        </div>
        <button class="btn-start" style="background: #e53e3e !important; margin-top:10px;" onclick="clearLeaderboard()">🗑️ Clear All Scores / डेटा डिलीट करें</button>
        <button class="btn-start" style="background: #718096 !important; margin-top:10px;" onclick="location.reload()">Back to Quiz Start</button>
    </div>
</div>

<script>
    const quizData = [
        {
            qHi: "1. GCA का पूरा नाम क्या हैं ?", qEn: "What is full form of GCA ?",
            optsHi: ["ग्लोबल कस्टमर ऑडिट", "गुड्स कस्टमर ऑडिट", "ग्लोबल सेण्टर ऑडिट", "ग्लोबल कण्ट्रोल ऑडिट"],
            optsEn: ["Global Customer Audit", "Goods Customer Audit", "Global Center Audit", "Global Control Audit"],
            correct: 0
        },
        {
            qHi: "2. MOS का पूरा नाम क्या हैं ?", qEn: "What is full form of MOS ?",
            optsHi: ["मारुती ऑपरेशन सिस्टम", "मल्टी ऑपरेशन सिस्टम", "मारुती ऑपरेशन स्टैंडर्ड्", "मारुती ओवरआल स्टैण्डर्ड"],
            optsEn: ["Maruti Operation System", "Multi Operation System", "Maruti Operation Standard", "Maruti Overall Standard"],
            correct: 2
        },
        {
            qHi: "3. ISO -9001-2015 का क्या उद्देश्य हें", qEn: "What is ISO-9001-2015 for?",
            optsHi: ["सुरक्षा", "पर्यावरण", "गुणवत्ता", "कीमत"],
            optsEn: ["Safety", "Environment", "Quality", "Cost"],
            correct: 2
        },
        {
            qHi: "4. MSIL प्लांट के अंदर ड्राइविंग के लिए क्या ज़रूरी हें", qEn: "What is required to drive vehicle inside MSIL plant?",
            optsHi: ["लाइसेन्स", "' D' बॅड्ज", "पहचान पत्र", "कुछ भी नही"],
            optsEn: ["License", "'D' Badge", "ID Card", "Nothing"],
            correct: 1
        },
        {
            qHi: "5. अगर किसी वजह से गाड़ी चेक नहीं की जा सकी हो तो क्या करें?",
            qEn: "If you have failed to complete the inspection, what should be done ?",
            optsHi: ["वाहन को बिना निरीक्षण के जाने दें", "चेक शीट के special कॉलम में स्टेशन के नाम के साथ 'NO CHECK' लिखें", "स्टाम्प न लगाएं", "Option B और C"],
            optsEn: ["Let the vehicle go without inspection", "Write 'NO CHECK' with station name in special column of check sheet", "Do not apply stamp", "Option B and C"],
            correct: 3
        }
    ];

    let currentQuestionIndex = 0, startTime, timerInterval, perfectScore = true;
    let userName = "", userEmpId = "", finalTimeElapsedMs = 0;

    function validateAndStart() {
        userName = document.getElementById('player-name').value.trim();
        userEmpId = document.getElementById('player-id').value.trim();
        if(!userName || !userEmpId){
            alert("Please enter Name and Employee ID!");
            return;
        }
        startQuiz();
    }

    function startQuiz() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        startTime = performance.now();
        timerInterval = setInterval(updateTimer, 10);
        showQuestion();
    }

    function updateTimer() {
        const timeElapsed = performance.now() - startTime;
        finalTimeElapsedMs = timeElapsed;
        const minutes = Math.floor(timeElapsed / 60000);
        const seconds = Math.floor((timeElapsed % 60000) / 1000);
        const milliseconds = Math.floor(timeElapsed % 1000);
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
    }

    function showQuestion() {
        const currentQuestion = quizData[currentQuestionIndex];
        document.getElementById('q-hi').innerText = currentQuestion.qHi;
        document.getElementById('q-en').innerText = currentQuestion.qEn;
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        currentQuestion.optsHi.forEach((optHi, index) => {
            const optEn = currentQuestion.optsEn[index];
            const button = document.createElement('button');
            button.classList.add('btn');
                   button.innerHTML = `
            <span style="display:block; font-weight:600; color:#2d3748;">${optHi}</span>
            <span style="display:block; font-size:14px; color:#718096; font-style:italic;">${optEn}</span>
        `;
        button.onclick = () => handleAnswer(index);
        optionsContainer.appendChild(button);
    });
}

function handleAnswer(selectedIndex) {
    if (selectedIndex !== quizData[currentQuestionIndex].correct) perfectScore = false;
    currentQuestionIndex++;
    if (currentQuestionIndex < quizData.length) { showQuestion(); } else { endQuiz(); }
}

function handleRenderTable(records, containerId) {
    records.sort((a, b) => {
        if (a.perfect !== b.perfect) return a.perfect ? -1 : 1;
        return a.timeMs - b.timeMs;
    });

    let html = `
        <table class="master-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Participant Name</th>
                    <th>Token ID</th>
                    <th>Speed Time</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody>
    `;

    if(records.length === 0) {
        html += `<tr><td colspan="5" style="text-align:center; color:#a0aec0;">No submissions yet.</td></tr>`;
    } else {
        records.forEach((player, index) => {
            const isWinner = (index === 0 && player.perfect);
            const rowStyle = isWinner ? 'winner-row' : '';
            const rankDisplay = isWinner ? '🏆 1st Place' : `${index + 1}`;
            const statusDisplay = player.perfect ? '✅ Perfect 5/5' : '❌ Disqualified';
            
            html += `
                <tr class="${rowStyle}">
                    <td>${rankDisplay}</td>
                    <td>${player.name}</td>
                    <td>${player.empId}</td>
                    <td>${player.timeStr}</td>
                    <td>${statusDisplay}</td>
                </tr>
            `;
        });
    }
    html += `</tbody></table>`;
    let element = document.getElementById(containerId);
    if(element) element.innerHTML = html;
}

function endQuiz() {
    clearInterval(timerInterval);
    const finalTimeStr = document.getElementById('timer').innerText;
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.remove('hidden');
    
    const resultMessage = document.getElementById('result-message');
    if (perfectScore) {
        resultMessage.innerHTML = `<div style="font-size:24px; font-weight:bold; color:#38a169;">🏆 PERFECT SCORE! 🏆</div><p>Time: <b>${finalTimeStr}</b></p>`;
    } else {
        resultMessage.innerHTML = `<div style="font-size:24px; font-weight:bold; color:#e53e3e;">❌ Disqualified ❌</div><p>Incorrect answers recorded.</p>`;
    }

    let currentList = JSON.parse(localStorage.getItem('msil_october_quiz_scores')) || [];
    if(!Array.isArray(currentList)) { currentList = []; }
    
    currentList.push({
        name: userName,
        empId: userEmpId,
        timeMs: finalTimeElapsedMs,
        timeStr: finalTimeStr,
        perfect: perfectScore
    });

    localStorage.setItem('msil_october_quiz_scores', JSON.stringify(currentList));
    handleRenderTable(currentList, 'end-leaderboard-container');
}

function showMasterDashboard() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('master-dashboard-screen').classList.remove('hidden');
    
    let records = JSON.parse(localStorage.getItem('msil_october_quiz_scores')) || [];
    if(!Array.isArray(records)) { records = []; }
    handleRenderTable(records, 'master-table-container');
}

function clearLeaderboard() {
    if(confirm("Are you sure you want to delete all scores? / क्या आप सारा डेटा डिलीट करना चाहते हैं?")) {
        localStorage.removeItem('msil_october_quiz_scores');
        showMasterDashboard();
    }
}

window.onload = function() {
    let currentList = JSON.parse(localStorage.getItem('msil_october_quiz_scores')) || [];
    if(Array.isArray(currentList) && document.getElementById('end-leaderboard-container')) {
        handleRenderTable(currentList, 'end-leaderboard-container');
    }
}
</script>
</body>
</html>
